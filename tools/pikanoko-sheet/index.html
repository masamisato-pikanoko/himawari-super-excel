<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202124">
<title>ぴかのこ Sheet設計盤</title>
<style>
:root{
  --grid:#d9d9d9;--head:#f3f3f3;--text:#222;--bar:#292b2f;--tab:#33363b;
  --active:#70b58f;--cellw:88px;--cellh:clamp(28px,calc((100dvh - 88px)/15),34px);--roww:36px
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fff;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
body{overflow:hidden}
button,input{font:inherit}
.app{height:100dvh;display:flex;flex-direction:column}
.sheet{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:var(--roww) repeat(10,var(--cellw));
  grid-template-rows:28px repeat(15,var(--cellh));width:max-content;min-width:100%}
.corner,.head,.row{background:var(--head);border-right:1px solid var(--grid);
  border-bottom:1px solid var(--grid);display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#333;user-select:none}
.cell{width:var(--cellw);height:var(--cellh);border:0;border-right:1px solid var(--grid);
  border-bottom:1px solid var(--grid);border-radius:0;padding:0 5px;background:#fff;color:#222;
  font-size:16px;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  -webkit-appearance:none;appearance:none}
.cell:focus{box-shadow:inset 0 0 0 2px #4285f4;position:relative;z-index:2}
.bottom{flex:0 0 auto;display:flex;min-height:58px;background:var(--bar);
  border-top:1px solid #1f2023;padding-bottom:env(safe-area-inset-bottom)}
.tabs{flex:1;min-width:0;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 112px;height:58px;display:flex;align-items:center;background:var(--tab);
  border-right:1px solid #4b4e54;box-shadow:inset 0 0 0 transparent}
.tab.active{background:#303338;box-shadow:inset 0 -3px 0 var(--active)}
.tab input{width:100%;height:44px;border:0;outline:0;background:transparent;color:#d7d9dc;
  text-align:center;font-size:15px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active input{color:#b7e6c8;font-weight:700}
.handoff{flex:0 0 106px;border:0;border-left:1px solid #4b4e54;background:var(--bar);
  color:#ffd6ad;font-size:14px;font-weight:800}
.handoff:active{background:#383b40}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#202124;color:#fff;
  padding:8px 12px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.15s;
  white-space:nowrap;z-index:10}
.toast.show{opacity:.95}
@media(max-width:390px){:root{--cellw:82px}.tab{flex-basis:104px}.handoff{flex-basis:98px;font-size:13px}}
</style>
</head>
<body>
<div class="app">
  <div class="sheet"><div class="grid" id="grid"></div></div>
  <div class="bottom">
    <div class="tabs" id="tabs"></div>
    <button class="handoff" id="handoff" type="button">🍪に渡す</button>
  </div>
</div>
<div class="toast" id="toast">URLコピーしたこ</div>
<script>
(()=>{
"use strict";
const LETTERS="ABCDEFGHIJ", ROWS=15, TABCOUNT=8;
const grid=document.getElementById("grid"), tabsEl=document.getElementById("tabs");
const toast=document.getElementById("toast"), handoff=document.getElementById("handoff");
let state=blank(), active=0, timer=null;

function blank(){
  return {format:"pikanoko-sheet-url",version:1,rows:15,cols:10,activeTab:0,
    tabs:Array.from({length:TABCOUNT},(_,i)=>({name:"シート"+(i+1),cells:{}}))};
}
function valid(x){
  return x&&Array.isArray(x.tabs)&&x.tabs.length===TABCOUNT;
}
function enc(s){
  const bytes=new TextEncoder().encode(s);let bin="";
  for(const b of bytes)bin+=String.fromCharCode(b);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function dec(s){
  s=s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  const bin=atob(s), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function load(){
  const m=location.hash.match(/^#d=([A-Za-z0-9_-]+)$/);
  if(!m)return;
  try{
    const x=JSON.parse(dec(m[1]));
    if(valid(x)){state=x;active=Math.max(0,Math.min(7,Number(x.activeTab)||0));}
  }catch{}
}
function syncUrl(){
  state.activeTab=active;
  const h="#d="+enc(JSON.stringify(state));
  history.replaceState(null,"",location.pathname+location.search+h);
}
function queueSync(){clearTimeout(timer);timer=setTimeout(syncUrl,120);}
function showToast(text){
  toast.textContent=text;toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1200);
}
function renderTabs(){
  tabsEl.innerHTML="";
  state.tabs.forEach((tab,i)=>{
    const wrap=document.createElement("div");
    wrap.className="tab"+(i===active?" active":"");
    const input=document.createElement("input");
    input.type="text";input.value=tab.name;input.maxLength=24;input.autocomplete="off";input.spellcheck=false;
    input.setAttribute("aria-label","タブ"+(i+1)+"の名前");
    input.addEventListener("pointerdown",()=>{if(active!==i){active=i;render();queueSync();}});
    input.addEventListener("focus",()=>{if(active!==i){active=i;render();queueSync();}});
    input.addEventListener("input",()=>{state.tabs[i].name=input.value||("シート"+(i+1));queueSync();});
    wrap.appendChild(input);tabsEl.appendChild(wrap);
  });
}
function renderGrid(){
  grid.innerHTML="";
  const corner=document.createElement("div");corner.className="corner";grid.appendChild(corner);
  for(const c of LETTERS){const h=document.createElement("div");h.className="head";h.textContent=c;grid.appendChild(h);}
  for(let r=1;r<=ROWS;r++){
    const rh=document.createElement("div");rh.className="row";rh.textContent=r;grid.appendChild(rh);
    for(const c of LETTERS){
      const addr=c+r, input=document.createElement("input");
      input.className="cell";input.type="text";input.value=state.tabs[active].cells[addr]||"";
      input.autocomplete="off";input.spellcheck=false;input.setAttribute("aria-label",state.tabs[active].name+" "+addr);
      input.addEventListener("input",()=>{
        const v=input.value;
        if(v)state.tabs[active].cells[addr]=v;else delete state.tabs[active].cells[addr];
        queueSync();
      });
      grid.appendChild(input);
    }
  }
}
function render(){renderTabs();renderGrid();}
handoff.addEventListener("click",async()=>{
  syncUrl();
  const url=location.href;
  try{await navigator.clipboard.writeText(url);showToast("URLコピーしたこ");}
  catch{
    const ta=document.createElement("textarea");ta.value=url;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");showToast("URLコピーしたこ");}
    catch{showToast("URLを長押しコピーしてね");}
    ta.remove();
  }
});
load();render();syncUrl();
})();
</script>
</body>
</html>
